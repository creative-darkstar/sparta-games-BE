name: CD Pipeline

# 배포 시점
# - dev -> main PR 이 "merge 되었을 때" 한 번만 배포 (PR 열기/커밋 추가 시에는 실행 안 함)
# - Actions 탭의 "Run workflow" 버튼으로 수동 배포 (main 직접 커밋 후 배포할 때 사용)
on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

# 배포가 겹쳐서 실행되지 않도록 순서대로 하나씩 실행
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  cd:
    name: Deploy to EC2 (Docker Compose)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true
        && github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_PEM }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to EC2
      run: |
        ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} 'bash -s' << 'EOF'
          set -euo pipefail

          cd ${{ secrets.EC2_PROJECT_DIR }}

          echo "=== 1. 최신 main 코드 받기 ==="
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          echo "=== 2. 이미지 재빌드 ==="
          docker compose build

          echo "=== 3. DB 마이그레이션 / static 업로드(S3) ==="
          docker compose run --rm spartagames-be python manage.py migrate --noinput
          docker compose run --rm spartagames-be python manage.py collectstatic --noinput

          echo "=== 4. 컨테이너 재생성 및 실행 ==="
          mkdir -p logs
          docker compose up -d --remove-orphans

          echo "=== 5. 사용하지 않는 이미지 정리 ==="
          docker image prune -f

          docker compose ps
        EOF

    - name: Notify to Discord
      if: always()
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_GIT_DEPLOY_URL }}
        STATUS: ${{ job.status }}
        ACTOR: ${{ github.actor }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        # PR merge 배포면 PR 제목, 수동 배포면 "수동 배포"
        # 값 안의 " #" 가 YAML 주석으로 처리되지 않도록 큰따옴표로 감쌈
        COMMIT_MSG: "${{ github.event.pull_request.title && format('PR #{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || '수동 배포 (workflow_dispatch)' }}"
      run: |
        COLOR="3066993"  # 성공: 파랑
        ICON="✅"
        if [ "$STATUS" != "success" ]; then
          COLOR="15158332"  # 실패: 빨강
          ICON="❌"
        fi

        DEPLOY_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        jq -n --arg icon "$ICON" \
              --arg status "$STATUS" \
              --arg repo "$REPO" \
              --arg branch "$BRANCH" \
              --arg actor "$ACTOR" \
              --arg time "$DEPLOY_TIME" \
              --arg msg "$COMMIT_MSG" \
              --arg sha "$COMMIT_SHA" \
              --arg color "$COLOR" \
              '{
            embeds: [{
              title: "\($icon) CD 배포 결과 (\($status))",
              description: "**[\($repo)]** 브랜치 `\($branch)` 에 배포되었습니다.",
              color: ($color|tonumber),
              fields: [
                { name: "👤 배포자", value: $actor, inline: true },
                { name: "🕒 배포 시간 (UTC)", value: $time, inline: true },
                { name: "💬 내용", value: $msg },
                { name: "🔗 커밋 링크", value: "https://github.com/\($repo)/commit/\($sha)" }
              ],
              timestamp: $time
            }]
          }' | curl -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK_URL"
